<!doctype html>
<!-- Toolbar popup (Figma « Extension » 95:91, 96:146, 97:201), redrawn on 30/09: one 16 px gutter for
     every row, the state first, the people of the conversation with their character on the left. -->
<html lang="fr"><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Momo Trust Sans"; src: url(fonts/momo-trust-sans-latin-wght-normal.woff2) format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Momo Trust Sans"; src: url(fonts/momo-trust-sans-latin-ext-wght-normal.woff2) format("woff2"); font-weight: 200 800; unicode-range: U+0100-024F, U+1E00-1EFF; }
  @font-face { font-family: "Atkinson Hyperlegible Mono"; src: url(fonts/atkinson-hyperlegible-mono-latin-wght-normal.woff2) format("woff2"); font-weight: 200 800; }
  :root { --page: #F3F3EF; --surface: #FBFBF8; --surface-2: #E9E9E4; --line: #DDDDD6; --ink: #16181D; --ink-2: #555A63; --ink-3: #8C9098;
          --ok: #00AA93; --leak: #F15060; --real: #FFB511; --double: #0078BF; --knob: #FBFBF8; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --page: #111216; --surface: #1A1C21; --surface-2: #23262C; --line: #2E3138; --ink: #F3F3EF; --ink-2: #A7ABB2; --ink-3: #6E737B;
            --ok: #2CC2AB; --leak: #F36B79; --double: #3A9BD9; --knob: #A7ABB2; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 340px; background: var(--surface); color: var(--ink); font: 400 14px/1.5 "Momo Trust Sans", -apple-system, system-ui, sans-serif;
         -webkit-font-smoothing: antialiased; }
  p { margin: 0; }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  /* one gutter for every row: 16 px */
  header { display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; letter-spacing: -0.02em; }
  .logo { width: 20px; height: 15.671px; flex: none; }
  .badge { display: flex; align-items: center; gap: 8px; height: 24px; padding: 0 10px 0 8px; border-radius: 999px; background: var(--surface-2);
           font-size: 12px; font-weight: 600; line-height: 1.35; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
  .state { display: flex; flex-direction: column; gap: 4px; padding: 20px 16px; }
  .title { font-size: 18px; font-weight: 600; line-height: 1.25; letter-spacing: -0.01em; }
  .count, .hint { color: var(--ink-2); }
  .stopped { display: inline-flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 600; line-height: 1.25; letter-spacing: -0.01em; }
  .stopped .dot { background: var(--leak); }
  .stopped.starting .dot { background: var(--ink-3); }
  #thread { border-top: 1px solid var(--line); padding: 12px 0 8px; }
  .section { padding: 0 16px 4px; font-size: 12px; font-weight: 600; line-height: 1.35; color: var(--ink-3); }
  .people { max-height: 240px; overflow-y: auto; }
  .row { display: flex; align-items: center; gap: 12px; padding: 8px 16px; }
  .disc { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; background: var(--real); flex: none; }
  .disc svg { width: 100%; height: 100%; display: block; }
  .names { display: flex; flex-direction: column; flex: 1 0 0; min-width: 1px; overflow: hidden; white-space: nowrap; }
  .names b { font-size: 14px; font-weight: 600; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; }
  .names span { font-size: 12px; font-weight: 500; line-height: 1.35; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; }
  .times { font: 500 12px/1.35 "Atkinson Hyperlegible Mono", ui-monospace, monospace; color: var(--ink-3); white-space: nowrap; }
  #tools { border-top: 1px solid var(--line); }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; height: 48px; padding: 0 16px; margin: 0; border: 0;
            background: none; text-align: left; cursor: pointer; transition: background-color 180ms ease-out; }
  .switch:hover { background: var(--page); }
  /* track 36×20; on = blue: the doubles are on screen */
  .track { position: relative; width: 36px; height: 20px; border-radius: 10px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); flex: none;
           transition: background-color 180ms ease-out, box-shadow 180ms ease-out; }
  .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--knob);
                  box-shadow: 0 1px 2px rgba(20,20,30,.25); transition: transform 180ms ease-out, background-color 180ms ease-out; }
  .switch[aria-checked="true"] .track { background: var(--double); box-shadow: none; }
  .switch[aria-checked="true"] .track::after { transform: translateX(16px); background: #FBFBF8; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px 16px; }
  .foot.alone { padding-top: 16px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; height: 36px; padding: 0 16px; border: 0; border-radius: 999px;
         background: var(--surface-2); color: var(--ink); font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
         transition: opacity 180ms ease-out; }
  .btn:hover { opacity: .9; } .btn:active { opacity: .8; }
  .btn.main { padding: 0 22px; background: var(--ink); color: var(--page); }
  .link { height: 36px; padding: 0; border: 0; background: none; color: var(--ink-2); font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .link:hover { color: var(--ink); text-decoration: underline 1px; text-underline-offset: 3px; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style></head><body>

<section class="state" data-figma="etat">
  <div id="status"><p class="title" id="label" data-figma="statut-texte">Protection active</p></div>
  <p class="count" id="count" data-figma="compteur"></p>
  <div id="stopped" hidden><span class="stopped"><span class="dot"></span><span id="why">Arsène est arrêté</span></span></div>

</section>
<div id="thread" hidden>
  <p class="section">Dans cette conversation</p>
  <div class="people" id="people" data-figma="personnes"></div>
</div>
<div id="tools">
  <button class="switch" id="aiView" data-figma="interrupteur" role="switch" aria-checked="false">Voir ce que l'IA a lu<span class="track"></span></button>
  <div class="foot" id="foot"><button class="btn" id="toggle" data-figma="lien">Pause sur ce site</button></div>
</div>
<script src="popup.js"></script>
</body></html>
